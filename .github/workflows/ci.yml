name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-gate:
    name: Build Gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build all derivations
        run: >-
          nix build --quiet
          .#checks.x86_64-linux.shellcheck
          .#checks.x86_64-linux.format-check
          .#checks.x86_64-linux.syntax
          .#checks.x86_64-linux.secrets-gate
          .#checks.x86_64-linux.publish-gate
          .#checks.x86_64-linux.site-check
          .#checks.x86_64-linux.loop-runtime
          .#checks.x86_64-linux.schema-reject
          .#checks.x86_64-linux.host-stale
          .#checks.x86_64-linux.image-source-shape
          .#devShells.x86_64-linux.default.inputDerivation

  shellcheck:
    name: CI shellcheck
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run shellcheck
        run: nix run --quiet .#shellcheck

  format:
    name: CI format
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check formatting
        run: nix run --quiet .#format-check

  syntax:
    name: CI syntax
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check syntax
        run: nix run --quiet .#syntax

  secrets-gate:
    name: CI secrets gate
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check for secrets
        run: nix run --quiet .#secrets-gate

  publish-gate:
    name: CI publish gate
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Test publish gate
        run: nix run --quiet .#publish-gate

  site:
    name: CI site
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check site
        run: nix run --quiet .#site-check

  image:
    name: CI collector image
    needs: build-gate
    runs-on: nixos
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      # No cachix here on purpose: every docker call below runs through the
      # flake's pinned docker client, and the publish step authenticates to
      # GHCR with GITHUB_TOKEN only. GITHUB_REPOSITORY and GITHUB_SHA come
      # from the runner's default environment.
      # One-time setup, outside this file: flip the pushed package to public
      # in GHCR so the collector host pulls without a credential.
      - name: Check the image is clean
        run: nix run --quiet .#image-clean
      - name: Smoke test the collector image
        run: nix run --quiet .#container-smoke
      - name: Smoke test the reporter image
        run: nix run --quiet .#reporter-smoke
      - name: Smoke test the verdict push step
        run: nix run --quiet .#push-verdict-smoke
      - name: Build collector image
        run: nix run --quiet .#image-publish
      - name: Publish collector image
        if: github.event_name == 'push'
        env:
          PUBLISH: '1'
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: nix run --quiet .#image-publish
      - name: Build reporter image
        run: nix run --quiet .#reporter-publish
      - name: Publish reporter image
        if: github.event_name == 'push'
        env:
          PUBLISH: '1'
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: nix run --quiet .#reporter-publish

  pr-preview:
    name: CI PR preview
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: nixos
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Assemble preview site
        run: |
          rm -rf preview-site
          mkdir -p preview-site/runs
          cp site/index.html preview-site/
          cp preview-sample/data.json preview-site/
          cp preview-sample/property-descriptions.json preview-site/
          cp preview-sample/runs/*.json preview-site/runs/
      - name: Smoke test preview on localhost
        run: nix run --quiet .#preview-smoke
      - id: preview
        uses: paolino/dev-assets/static-preview@main
        with:
          path: preview-site
      - name: Verify served preview files
        run: nix run --quiet .#preview-verify -- "${{ steps.preview.outputs.preview-url }}"

  dev-shell:
    name: CI dev shell
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check shell tools
        run: nix develop --quiet -c bash -c 'command -v shellcheck && command -v shfmt && command -v jq && command -v just'

  pr-preview-cleanup:
    name: CI PR preview cleanup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: nixos
    steps:
      - uses: paolino/dev-assets/static-preview@main
        with:
          mode: cleanup
